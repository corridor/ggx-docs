# nginx settings for docs.genguardx.ai. Include inside the `server { ... }` block.
# Not applied automatically: the deploy workflow only syncs dist/ to the host.

# Keep redirects (e.g. /faq -> /faq/) relative so they never downgrade https to http behind Cloudflare.
absolute_redirect off;

# Hashed build assets never change: cache them for a year.
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Other static media: cache for a week.
location ~* \.(mp4|webm|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=604800";
}

# HTML, sitemap, robots and llms files stay revalidated so new deploys show up quickly.
