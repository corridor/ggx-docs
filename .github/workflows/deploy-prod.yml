name: Deploy to production

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job exchange its GitHub identity for short-lived AWS credentials.
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "production"
  cancel-in-progress: false

env:
  SITE_URL: https://docs.genguardx.ai
  DEPLOY_USER: ec2-user
  # nginx serves the site from this directory. It is synced with --delete, so keep it pointed at the docs root only.
  DEPLOY_PATH: /opt/ggx-docs/dist
  AWS_REGION: us-west-2

jobs:
  deploy:
    # Add required reviewers to this environment to require approval before each production deployment.
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so "Last updated" dates and sitemap <lastmod> reflect each page's own commits.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Check build output
        run: |
          test -s dist/index.html
          test -s dist/sitemap-index.xml
          # Production must stay indexable: never ship the test robots file.
          cmp -s public/robots.txt dist/robots.txt
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The server does not accept SSH from GitHub's runners. PROD_SECURITY_GROUP_ID is a group
      # attached only to the docs server and kept empty, so allow this runner's IP on it for the
      # length of the sync and remove it afterwards.
      - name: Allow SSH from this runner
        id: allow-ssh
        env:
          SECURITY_GROUP_ID: ${{ secrets.PROD_SECURITY_GROUP_ID }}
        run: |
          # Clear any rule left behind by a cancelled run.
          stale="$(aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=${SECURITY_GROUP_ID}" \
            --query 'SecurityGroupRules[?!IsEgress].SecurityGroupRuleId' --output text)"
          if [ -n "$stale" ]; then
            aws ec2 revoke-security-group-ingress --group-id "$SECURITY_GROUP_ID" \
              --security-group-rule-ids $stale > /dev/null
          fi
          runner_ip="$(curl --fail --silent --show-error --retry 3 https://checkip.amazonaws.com)"
          aws ec2 authorize-security-group-ingress --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${runner_ip}/32" > /dev/null
          echo "cidr=${runner_ip}/32" >> "$GITHUB_OUTPUT"
      - name: Sync site to the production server
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          # The docs root is owned by root, so rsync runs under sudo on the server.
          # Retry while the new security group rule takes effect.
          for attempt in 1 2 3 4 5; do
            if rsync -rltz --delete --delay-updates --chmod=D755,F644 \
              --rsync-path="sudo rsync" \
              -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
              dist/ "${DEPLOY_USER}@${SSH_HOST}:${DEPLOY_PATH}/"; then
              exit 0
            fi
            echo "Sync attempt ${attempt} failed"
            sleep 5
          done
          exit 1
      - name: Remove SSH access for this runner
        if: always() && steps.allow-ssh.outputs.cidr != ''
        env:
          SECURITY_GROUP_ID: ${{ secrets.PROD_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.allow-ssh.outputs.cidr }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" > /dev/null
      - name: Verify production site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null "${SITE_URL}/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${SITE_URL}/sitemap-index.xml" \
            | grep -q "<sitemapindex"
          if curl --fail --silent --show-error "${SITE_URL}/robots.txt" | grep -qx "Disallow: /"; then
            echo "::error::Production is serving a robots.txt that blocks all crawlers"
            exit 1
          fi
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
